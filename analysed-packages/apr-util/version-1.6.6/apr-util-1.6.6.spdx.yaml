    \ Government Department of Commerce, Bureau of Industry and\nSecurity (BIS), has\
    \ classified this software as Export Commodity\nControl Number (ECCN) 5D002.C.1,\
    \ which includes information security\nsoftware using or performing cryptographic\
    \ functions with asymmetric\nalgorithms. The form and manner of this Apache Software\
    \ Foundation\ndistribution makes it eligible for export under the License Exception\n\
    ENC Technology Software Unrestricted (TSU) exception (see the BIS\nExport Administration\
    \ Regulations, Section 740.13) for both object\ncode and source code.\n\nThe following\
    \ provides more details on the included cryptographic\nsoftware:\n\nAPR-Util provides\
    \ an abstract interface for symmetrical cryptographic\nfunctions that make use\
    \ of a general-purpose encryption library,\nsuch as OpenSSL, NSS, or the operating\
    \ system's platform-specific\nfacilities. This interface is known as the apr_crypto\
    \ interface,\nwith implementation beneath the /crypto directory.\n\nAPR-Util provides\
    \ an abstract interface for SSL encrypted LDAP (ldaps\nand STARTTLS style) connections,\
    \ which can be powered by OpenLDAP,\nNetscape LDAP SDK, Mozilla LDAP SDK, or other\
    \ platform specific ldap\ninterfaces."
